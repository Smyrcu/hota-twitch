name: backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  RELEASE_ROOT: /opt/hota-twitch/releases
  CURRENT_LINK: /opt/hota-twitch/current
  HEALTH_URL: https://hota.smyrcu.net/health
  HEALTH_TIMEOUT_SECONDS: "120"
  KEPT_RELEASES: "5"
  SSH_OPTIONS: -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_deploy

jobs:
  build-and-deploy:
    name: build, test and deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test --configuration Release --no-build

      - name: Publish self-contained linux-x64
        working-directory: backend
        run: |
          dotnet publish src/HotaTwitch.Api/HotaTwitch.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            --output "$GITHUB_WORKSPACE/publish"

      - name: Set up SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Upload the release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release="$RELEASE_ROOT/$GITHUB_SHA"
          tar -czf - -C publish . \
            | ssh $SSH_OPTIONS "$DEPLOY_USER@$DEPLOY_HOST" \
                "set -eu; rm -rf '$release'; mkdir -p '$release'; tar -xzf - -C '$release'; chmod +x '$release/HotaTwitch.Api'"

      - name: Switch current and restart the service
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release="$RELEASE_ROOT/$GITHUB_SHA"
          previous=$(ssh $SSH_OPTIONS "$DEPLOY_USER@$DEPLOY_HOST" "readlink -f '$CURRENT_LINK' 2>/dev/null || true")
          echo "PREVIOUS_RELEASE=$previous" >> "$GITHUB_ENV"
          ssh $SSH_OPTIONS "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; if [ -d '$CURRENT_LINK' ] && [ ! -L '$CURRENT_LINK' ]; then rmdir '$CURRENT_LINK'; fi; ln -sfnT '$release' '$CURRENT_LINK'; sudo systemctl restart hota-twitch"

      - name: Wait for the service to answer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: health
        run: |
          deadline=$((SECONDS + HEALTH_TIMEOUT_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --max-time 5 "$HEALTH_URL" | grep -q '"ok":true'; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$HEALTH_URL did not report {\"ok\":true} within $HEALTH_TIMEOUT_SECONDS s"
          exit 1

      - name: Put the previous release back
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && failure() && steps.health.outcome == 'failure' && env.PREVIOUS_RELEASE != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "::warning::rolling back to $PREVIOUS_RELEASE"
          ssh $SSH_OPTIONS "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; ln -sfnT '$PREVIOUS_RELEASE' '$CURRENT_LINK'; sudo systemctl restart hota-twitch"

      - name: Drop the oldest releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh $SSH_OPTIONS "$DEPLOY_USER@$DEPLOY_HOST" "set -eu
            cd '$RELEASE_ROOT'
            live=\$(basename \"\$(readlink -f '$CURRENT_LINK')\")
            ls -1t | grep -vFx \"\$live\" | tail -n +$KEPT_RELEASES | xargs -r rm -rf"
